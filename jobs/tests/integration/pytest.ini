[pytest]
minversion = 7.0

testpaths =
    jobs/tests

python_files =
    test_*.py
    *_test.py

python_classes =
    Test*

python_functions =
    test_*

norecursedirs =
    .git
    .venv
    .pytest_cache
    __pycache__
    scripts
    debug
    build
    dist

addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=5